name: FASE 8 - Validacion Secrets y Deploy

on:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar presencia de secrets (sin mostrar valores)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import os, sys
          missing = []
          for v in ['SUPABASE_DB_URL', 'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY']:
              if not os.environ.get(v):
                  missing.append(v)
          if missing:
              print(f'Secrets faltantes: {missing}')
              sys.exit(1)
          print('Todos los secrets estan presentes.')
          "

      - name: Ejecutar tests FASE 8 (PostgreSQL, REST, Storage, RLS)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m pytest tests/test_fase8_secrets.py -v --tb=short

      - name: Ejecutar suite completa
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: test-token
          TELEGRAM_CHAT_ID: test-chat-id
          SHEET_ID: test-sheet-id
          GOOGLE_REFRESH_TOKEN: test-refresh
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-secret
        run: |
          python -m pytest tests/ -v --tb=short
